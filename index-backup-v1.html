<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cloud Arcade Live</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;font-family:Arial;color:white}#g{width:100vw;height:100vh;position:relative;background:radial-gradient(circle,#19365b,#070b15 70%)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.brand{position:absolute;top:3%;left:2.5%;font-size:clamp(18px,2.5vw,34px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 12px #000}.brand i{color:#55e9ff;font-style:normal}.live{position:absolute;right:2.5%;top:3%;background:#091322dd;border:1px solid #45617e;border-radius:20px;padding:8px 14px;font-weight:bold}.live b{display:inline-block;width:9px;height:9px;background:#40ff80;border-radius:50%;box-shadow:0 0 12px #40ff80;margin-right:7px}.scores{position:absolute;left:2.5%;top:11%;display:grid;gap:7px;width:min(260px,25vw)}.card{background:#07111ddd;border:1px solid #34506d;border-radius:12px;padding:8px 11px;display:flex;gap:10px;align-items:center}.ball{width:25px;height:25px;border-radius:50%;box-shadow:0 0 14px currentColor}.card strong{margin-left:auto;font-size:18px}.chat{position:absolute;right:2.5%;top:11%;width:min(280px,27vw);background:#07111ddd;border:1px solid #34506d;border-radius:12px;padding:11px}.chat h3{margin:0 0 6px;color:#6cecff;font-size:15px}.chat p{margin:4px 0;font-size:12px;color:#d4deea}.event{position:absolute;left:50%;top:9%;transform:translateX(-50%);padding:9px 18px;border-radius:20px;background:#111a2ce8;border:1px solid #ffd34d;opacity:0;transition:.25s;font-weight:bold}.event.on{opacity:1}.bottom{position:absolute;bottom:3%;left:2.5%;right:2.5%;display:flex;justify-content:space-between;font-size:clamp(10px,1.1vw,14px)}.tip{background:#07111ddd;border:1px solid #34506d;border-radius:10px;padding:8px 12px}.spin{background:linear-gradient(135deg,#ffd84d,#ff8238);color:#17100a;border-radius:10px;padding:8px 13px;font-weight:900}
</style></head><body><div id="g"><canvas id="c"></canvas><div class="hud">
<div class="brand">CLOUD <i>ARCADE</i> LIVE</div><div class="live"><b></b>AI CHAOS ARENA</div>
<div class="scores"><div class="card" style="color:#4fdcff"><span class="ball" style="background:#4fdcff"></span><b>BOLT</b><strong id="s0">0</strong></div><div class="card" style="color:#ffd84d"><span class="ball" style="background:#ffd84d"></span><b>MOMO</b><strong id="s1">0</strong></div><div class="card" style="color:#ff5268"><span class="ball" style="background:#ff5268"></span><b>ROCCO</b><strong id="s2">0</strong></div></div>
<div class="chat"><h3>💬 LIVE CHAT POWER</h3><p>Viewer: <b>GO BOLT!</b></p><p>Viewer: <b>ROCCO ATTACK!</b></p><p>Viewer: <b>MOMO 🔥</b></p></div><div class="event" id="ev">⚡ <span id="et">SUPER SPIN!</span></div>
<div class="bottom"><div class="tip">🏆 Collect energy • Crash rivals • Chat controls the chaos</div><div class="spin">⚡ SUPER SPIN EVENT</div></div></div></div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,t=0,last=0,coins=[],fx=[];
const P=[{n:'BOLT',c:'#4fdcff',x:.34,y:.52,r:24,vx:0,vy:0,sp:2.8},{n:'MOMO',c:'#ffd84d',x:.5,y:.38,r:23,vx:0,vy:0,sp:2.35},{n:'ROCCO',c:'#ff5268',x:.67,y:.55,r:27,vx:0,vy:0,sp:1.9}];
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);P.forEach(p=>{if(!p.init){p.x*=W;p.y*=H;p.init=1}})}addEventListener('resize',resize);resize();
function A(){return{cx:W/2,cy:H*.54,rx:Math.min(W*.34,H*.43),ry:Math.min(W*.29,H*.36)}}function coin(){let a=Math.random()*6.28,Aa=A();coins.push({x:Aa.cx+Math.cos(a)*Aa.rx*.8,y:Aa.cy+Math.sin(a)*Aa.ry*.75})}for(let i=0;i<12;i++)coin();
function burst(X,Y,col){for(let i=0;i<10;i++)fx.push({x:X,y:Y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:1,c:col})}
function update(dt){t+=dt;if(Math.random()<.035)coin();P.forEach((p,i)=>{let target;if(i===1&&coins.length)target=coins.reduce((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?b:a);else target=P[(i+1)%3];let dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy)||1;p.vx+=(dx/d)*p.sp*.075;p.vy+=(dy/d)*p.sp*.075;p.vx*=.94;p.vy*=.94;let q=Math.hypot(p.vx,p.vy);if(q>p.sp){p.vx=p.vx/q*p.sp;p.vy=p.vy/q*p.sp}p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;let a=A(),rx=p.x-a.cx,ry=p.y-a.cy,z=rx*rx/(a.rx*a.rx)+ry*ry/(a.ry*a.ry);if(z>.82){let k=Math.sqrt(.82/z);p.x=a.cx+rx*k;p.y=a.cy+ry*k;p.vx*=-.5;p.vy*=-.5}coins.forEach((q,k)=>{if(Math.hypot(q.x-p.x,q.y-p.y)<p.r+11){p.score=(p.score||0)+10;burst(q.x,q.y,p.c);coins.splice(k,1)}});document.querySelector('#s'+i).textContent=p.score||0});
for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){let a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<a.r+b.r){a.score=(a.score||0)+1;b.score=(b.score||0)+1;a.vx-=dx/d*1.3;a.vy-=dy/d*1.3;b.vx+=dx/d*1.3;b.vy+=dy/d*1.3;burst((a.x+b.x)/2,(a.y+b.y)/2,'#fff')}}fx.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.l-=.035});fx=fx.filter(f=>f.l>0)}
function draw(){x.clearRect(0,0,W,H);let g=x.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H));g.addColorStop(0,'#19385c');g.addColorStop(1,'#050812');x.fillStyle=g;x.fillRect(0,0,W,H);let a=A();x.save();x.translate(a.cx,a.cy);x.shadowBlur=45;x.shadowColor='#25cfff66';x.fillStyle='#09172a';x.beginPath();x.ellipse(0,10,a.rx,a.ry,0,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#39739b';x.lineWidth=5;x.beginPath();x.ellipse(0,0,a.rx,a.ry,0,0,7);x.stroke();x.strokeStyle='#183b58';x.lineWidth=2;for(let i=0;i<12;i++){let q=i*Math.PI/6;x.beginPath();x.moveTo(Math.cos(q)*a.rx*.15,Math.sin(q)*a.ry*.15);x.lineTo(Math.cos(q)*a.rx*.95,Math.sin(q)*a.ry*.95);x.stroke()}x.restore();
coins.forEach(q=>{x.shadowBlur=18;x.shadowColor='#ffd84d';x.fillStyle='#ffd84d';x.beginPath();x.arc(q.x,q.y,9+Math.sin(t*5+q.x)*2,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff3a0';x.font='bold 10px Arial';x.textAlign='center';x.fillText('★',q.x,q.y+3)});
P.forEach(p=>{x.save();x.translate(p.x,p.y);x.shadowBlur=24;x.shadowColor=p.c;x.fillStyle=p.c;x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(-7,-5,5,0,7);x.arc(7,-5,5,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-7,-5,2,0,7);x.arc(7,-5,2,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(0,4,8,.15,3);x.stroke();x.fillStyle='#fff';x.font='900 11px Arial';x.textAlign='center';x.fillText(p.n,0,p.r+17);x.restore()});fx.forEach(f=>{x.globalAlpha=f.l;x.fillStyle=f.c;x.beginPath();x.arc(f.x,f.y,3+f.l*3,0,7);x.fill()});x.globalAlpha=1}
function loop(n){let dt=Math.min((n-last)/1000,.033)||.016;last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const names=['SUPER SPIN!','CHAT ATTACK!','BLUE BOOST!','DOUBLE COINS!','CHAOS MODE!'];setInterval(()=>{et.textContent=names[Math.random()*names.length|0];ev.classList.add('on');setTimeout(()=>ev.classList.remove('on'),2200)},10000);
</script></body></html>
