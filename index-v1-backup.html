<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Spin Live V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle,#17345a,#081321 55%,#040912)}header{height:12%;display:flex;justify-content:space-between;align-items:center;padding:10px 2.5%;background:#030812cc;border-bottom:1px solid #284466}.title{font-size:clamp(22px,3vw,38px);font-weight:900;letter-spacing:2px}.sub{font-size:11px;color:#9eb6d3}.timer{font-size:clamp(18px,2.5vw,30px);font-weight:900}.timer span{color:#ffd43b}.main{height:76%;display:grid;grid-template-columns:30% 40% 30%;gap:8px;padding:10px 1.5%}.card{background:#08111fcc;border:1px solid #29476a;border-radius:18px;padding:10px}.pname{text-align:center;font-weight:900;font-size:clamp(16px,2vw,25px)}.coins{text-align:center;color:#ffd43b;font-weight:900;font-size:clamp(14px,1.8vw,21px);margin:4px}.status{text-align:center;font-size:11px;color:#a8bed8;min-height:16px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.num,.bet{border:1px solid #355b84;background:#132842;color:white;border-radius:9px;padding:8px 2px;font-weight:800}.num.selected{background:#19a974;border-color:#63f0b2}.num.jack{background:#8f1824;border-color:#ff5a68}.bets{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:7px}.bet.selected{background:#d39416;border-color:#ffd85a}.center{display:flex;align-items:center;justify-content:center}.wheelWrap{position:relative;width:min(36vw,430px);height:min(36vw,430px)}canvas{width:100%;height:100%;filter:drop-shadow(0 15px 30px #0008)}.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #ffd43b;z-index:2}.centerText{position:absolute;top:48%;width:100%;text-align:center;font-weight:900;font-size:20px;pointer-events:none}.centerText small{display:block;font-size:10px;color:#a9bfd8}.bottom{height:12%;display:flex;align-items:center;justify-content:center;border-top:1px solid #223b59;background:#030812cc}.log{font-weight:700;color:#dbe8f7;font-size:clamp(12px,1.5vw,18px)}.jackpot{color:#ff5261;text-shadow:0 0 18px #ff3048}
</style></head><body><div class="app"><header><div><div class="title">SUPER SPIN</div><div class="sub">LIVE VIRTUAL GAME • 15 NUMBERS</div></div><div class="timer">SPIN DALAM <span id="timer">60</span>s</div></header>
<main class="main"><section><div class="card"><div class="pname">Raka</div><div class="coins" id="c1"></div><div class="status" id="s1"></div><div class="numbers" id="n1"></div><div class="bets" id="b1"></div></div></section>
<section class="center"><div class="wheelWrap"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas><div class="centerText">SPIN<small>1 — 15</small></div></div></section>
<section><div class="card"><div class="pname">Bimo</div><div class="coins" id="c2"></div><div class="status" id="s2"></div><div class="numbers" id="n2"></div><div class="bets" id="b2"></div></div></section></main>
<footer class="bottom"><div class="log" id="log">Kedua pemain sedang menentukan pilihan...</div></footer></div>
<script>
const bets=[100,500,1000,5000],N=15,arc=Math.PI*2/N;let rot=0,timer=60,spinning=false,history=[];
const P=[{coins:10000,num:0,bet:100,style:1},{coins:10000,num:0,bet:100,style:0}],C=['#243b5a','#31567b','#243b5a','#31567b','#243b5a','#31567b','#243b5a','#31567b','#243b5a','#31567b','#243b5a','#31567b','#b21f2d','#31567b','#243b5a'];
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('id-ID');
function setup(i){for(let x=1;x<=15;x++){let b=document.createElement('button');b.className='num'+(x===13?' jack':'');b.textContent=x;b.onclick=()=>{if(!spinning)P[i].num=x;render()};$('n'+(i+1)).appendChild(b)}bets.forEach(v=>{let b=document.createElement('button');b.className='bet';b.textContent=fmt(v);b.onclick=()=>{if(!spinning&&v<=P[i].coins)P[i].bet=v;render()};$('b'+(i+1)).appendChild(b)})}
setup(0);setup(1);
function choose(p){let w=Array(16).fill(1);history.slice(-8).forEach(n=>w[n]*=.65);w[13]*=p.style?3.2:1.35;let s=w.slice(1).reduce((a,b)=>a+b,0),r=Math.random()*s,n=1;for(let x=1;x<=15;x++){r-=w[x];if(r<=0){n=x;break}}p.num=n;p.bet=p.coins<5000?[100,500,1000][Math.floor(Math.random()*3)]:(p.style&&Math.random()<.35?5000:[100,500,1000][Math.floor(Math.random()*3)])}
function render(){P.forEach((p,i)=>{$('c'+(i+1)).textContent=fmt(p.coins)+' 🪙';$('s'+(i+1)).textContent='Pilihan terkunci: '+p.num+' • '+fmt(p.bet);[...$('n'+(i+1)).children].forEach((b,x)=>b.classList.toggle('selected',x+1===p.num));[...$('b'+(i+1)).children].forEach((b,x)=>b.classList.toggle('selected',bets[x]===p.bet))});draw()}
function draw(){let c=$('wheel'),x=c.getContext('2d');x.clearRect(0,0,700,700);x.save();x.translate(350,350);x.rotate(rot);for(let i=0;i<N;i++){let a=i*arc-Math.PI/2;x.beginPath();x.moveTo(0,0);x.arc(0,0,300,a,a+arc);x.closePath();x.fillStyle=C[i];x.fill();x.strokeStyle='#0a1524';x.lineWidth=4;x.stroke();x.save();x.rotate(a+arc/2);x.translate(215,0);x.rotate(Math.PI/2);x.fillStyle='white';x.font='bold 30px Arial';x.textAlign='center';x.fillText(i+1,0,0);x.restore()}x.beginPath();x.arc(0,0,58,0,Math.PI*2);x.fillStyle='#0a1423';x.fill();x.strokeStyle='#ffd43b';x.lineWidth=5;x.stroke();x.restore()}
function spin(){if(spinning)return;spinning=true;P.forEach(p=>{if(p.coins<=0)p.coins=10000;choose(p);p.coins-=p.bet});render();$('log').textContent='Taruhan terkunci. Roda mulai berputar...';let result=Math.floor(Math.random()*15)+1;history.push(result),result===13?$('log').innerHTML='<span class="jackpot">🔥 JACKPOT! ANGKA 13! 🔥</span>':'';let start=rot,target=-((result-1)*arc+arc/2),end=start+Math.PI*2*7+target-((start+target)%(Math.PI*2)),t0=performance.now(),dur=6200;function a(t){let q=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-q,4);rot=start+(end-start)*e;draw();q<1?requestAnimationFrame(a):finish(result)}requestAnimationFrame(a)}
function finish(r){spinning=false;P.forEach(p=>{if(p.num===r)p.coins+=p.bet*(r===13?10:2);if(p.coins<=0)p.coins=10000});if(r!==13)$('log').innerHTML='<span>Hasil roda: <b>'+r+'</b></span>';render();timer=60}
function tick(){timer--; $('timer').textContent=timer;if(timer<=0){timer=60;spin()}}setInterval(tick,1000);P.forEach(choose);render();
</script></body></html>
