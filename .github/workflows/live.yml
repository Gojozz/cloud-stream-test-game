name: YouTube Shorts Live Stream

on:
  workflow_dispatch:
  schedule:
    # Otomatis jalan setiap hari jam 19.00 WIB (12.00 UTC)
    - cron: '0 12 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Setup Virtual Audio
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser pulseaudio alsa-utils

          # Inisialisasi Audio
          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-null-sink sink_name=Virtual_Sink sink_properties=device.description="Virtual_Sink"
          pacmd set-default-sink Virtual_Sink

      - name: Start Express & Socket.io Server
        run: |
          node server.js &
          sleep 5

      - name: Start Headless Browser & Stream to YouTube Shorts
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Virtual Display Vertikal (720x1280)
          Xvfb :99 -screen 0 720x1280x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Browser (Tanpa Translate, GPU Akselerasi untuk Anti-Lag)
          chromium-browser --no-sandbox --disable-setuid-sandbox \
            --window-size=720,1280 \
            --window-position=0,0 \
            --kiosk \
            --incognito \
            --disable-translate \
            --disable-features=Translate \
            --disable-component-update \
            --autoplay-policy=no-user-gesture-required \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-webgl \
            http://localhost:3000 &
          sleep 5

          # 3. Stream FFmpeg (Suara + Video)
          ffmpeg -f x11grab -video_size 720x1280 -framerate 25 -i :99.0 \
            -f pulse -i Virtual_Sink.monitor \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -g 50 -keyint_min 25 -b:v 2000k -maxrate 2000k -bufsize 4000k \
            -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -t 3600 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
