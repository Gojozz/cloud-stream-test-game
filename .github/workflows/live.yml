name: Cloud Game YouTube Shorts Live

on:
  workflow_dispatch:

  schedule:
    # 19:00 WIB = 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest

    # Live berjalan maksimal 1 jam
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg python3 curl

      - name: Xvfb
        run: |
          Xvfb :99 -screen 0 720x1280x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          sleep 2

      - name: Web server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          curl -I http://127.0.0.1:8080/index.html

      - name: Chromium
        env:
          DISPLAY: :99
        run: |
          chromium-browser \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --disable-features=UseDBus \
            --window-size=720,1280 \
            --window-position=0,0 \
            http://127.0.0.1:8080/index.html >/tmp/chromium.log 2>&1 &

          sleep 8

      - name: Verify capture
        env:
          DISPLAY: :99
        run: |
          ffmpeg \
            -hide_banner \
            -f x11grab \
            -video_size 720x1280 \
            -framerate 30 \
            -i :99.0 \
            -frames:v 1 \
            -y /tmp/frame.png

          test -s /tmp/frame.png

      - name: Stream to YouTube
        env:
          DISPLAY: :99
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          test -n "$STREAM_KEY"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 720x1280 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -b:v 1800k \
            -minrate 1800k \
            -maxrate 1800k \
            -bufsize 3600k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmps://a.rtmps.youtube.com/live2/${STREAM_KEY}"
