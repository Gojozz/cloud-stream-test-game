name: YouTube Shorts Live Stream

on:
  workflow_dispatch:
  schedule:
    # 19.00 WIB = 12.00 UTC
    - cron: '0 12 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser pulseaudio

      - name: Start Express & Socket.io Server
        run: |
          node server.js &
          sleep 5

      - name: Start Headless Browser & Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          DISPLAY: :99
        run: |
          # ==========================================
          # 1. START PULSEAUDIO
          # ==========================================
          pulseaudio --start
          sleep 2

          # ==========================================
          # 2. CREATE VERTICAL 720x1280 DISPLAY
          # ==========================================
          Xvfb :99 -screen 0 720x1280x24 -ac +extension GLX +render &
          sleep 2

          # ==========================================
          # 3. START CHROMIUM - CLEAN STREAM MODE
          # ==========================================
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-translate \
            --disable-features=Translate,TranslateUI,TranslateSubFrames \
            --disable-extensions \
            --disable-component-extensions-with-background-pages \
            --disable-popup-blocking \
            --disable-notifications \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-restore-session-state \
            --disable-first-run-ui \
            --no-first-run \
            --no-default-browser-check \
            --lang=en-US \
            --accept-lang=en-US \
            --autoplay-policy=no-user-gesture-required \
            --window-size=720,1280 \
            --window-position=0,0 \
            --kiosk \
            http://localhost:3000 &

          sleep 8

          # ==========================================
          # 4. STREAM TO YOUTUBE
          # ==========================================
          ffmpeg \
            -f x11grab \
            -draw_mouse 0 \
            -video_size 720x1280 \
            -framerate 30 \
            -i :99.0 \
            -f pulse \
            -ac 2 \
            -i default \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -g 60 \
            -keyint_min 30 \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
