name: YouTube Shorts Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Setup Virtual Audio
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser pulseaudio pulseaudio-utils

          # Jalankan PulseAudio Virtual Daemon
          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-null-sink sink_name=MySink
          pacmd set-default-sink MySink

      - name: Start Express & Socket.io Server
        run: |
          node server.js &
          sleep 5

      - name: Start Headless Browser & Stream to YouTube Shorts
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Resolusi Virtual Display Vertikal 720x1280
          Xvfb :99 -screen 0 720x1280x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Buka Browser Chromium
          chromium-browser --no-sandbox --disable-setuid-sandbox \
            --window-size=720,1280 \
            --window-position=0,0 \
            --kiosk \
            --autoplay-policy=no-user-gesture-required \
            http://localhost:3000 &
          sleep 5

          # 3. Capture Screen & PulseAudio Virtual Output
          ffmpeg -f x11grab -video_size 720x1280 -framerate 30 -i :99.0 \
            -f pulse -i MySink.monitor \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -g 60 -keyint_min 30 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
