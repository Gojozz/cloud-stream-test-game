name: Marble Race YouTube Shorts Live

on:
  workflow_dispatch:
  schedule:
    # Setiap hari 19:00 WIB = 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser

      - name: Start Express & Socket.io Server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Gemini API key detected"
          else
            echo "Gemini API key not detected - fallback host will be used"
          fi

          node server.js > /tmp/server.log 2>&1 &
          sleep 5

          curl -I http://localhost:3000/index.html

      - name: Start Browser
        env:
          DISPLAY: :99
        run: |
          # Virtual display 9:16
          Xvfb :99 -screen 0 720x1280x24 &

          sleep 2

          # Chromium - menggunakan konfigurasi dari workflow
          # yang sudah terbukti berhasil menampilkan gambar.
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --window-size=720,1280 \
            --window-position=0,0 \
            --kiosk \
            --autoplay-policy=no-user-gesture-required \
            http://localhost:3000 \
            > /tmp/chromium.log 2>&1 &

          sleep 5

      - name: Stream to YouTube
        env:
          DISPLAY: :99
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          test -n "$STREAM_KEY"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 720x1280 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -g 60 \
            -keyint_min 30 \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 3600 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Debug Logs
        if: always()
        run: |
          echo "========== SERVER LOG =========="
          tail -100 /tmp/server.log || true

          echo "========== CHROMIUM LOG =========="
          tail -100 /tmp/chromium.log || true
