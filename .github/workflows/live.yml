name: Marble Race YouTube Vertical Live

on:
  workflow_dispatch:

  schedule:
    # 19:00 WIB = 12:00 UTC
    - cron: "0 12 * * *"

jobs:

  stream:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            chromium-browser \
            ffmpeg \
            python3 \
            curl

      - name: Install Node Dependencies
        run: |
          npm init -y
          npm install express socket.io @google/generative-ai

      - name: Start Xvfb
        run: |
          Xvfb :99 \
            -screen 0 720x1280x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            >/tmp/xvfb.log 2>&1 &

          sleep 3

      - name: Start Marble Server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "WARNING: GEMINI_API_KEY is missing"
          else
            echo "Gemini API key detected"
          fi

          node server.js >/tmp/server.log 2>&1 &

          sleep 5

          curl -I http://127.0.0.1:3000/index.html

      - name: Start Chromium
        env:
          DISPLAY: :99

        run: |

          chromium-browser \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --disable-features=UseDBus \
            --disable-translate \
            --disable-extensions \
            --window-size=720,1280 \
            --window-position=0,0 \
            --kiosk \
            http://127.0.0.1:3000/index.html \
            >/tmp/chromium.log 2>&1 &

          sleep 10

      - name: Verify Display
        env:
          DISPLAY: :99

        run: |

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -f x11grab \
            -video_size 720x1280 \
            -framerate 30 \
            -i :99.0 \
            -frames:v 1 \
            -y /tmp/frame.png

          test -s /tmp/frame.png

          echo "Vertical display capture OK"

      - name: Stream to YouTube
        env:
          DISPLAY: :99
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |

          test -n "$STREAM_KEY"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 720x1280 \
            -framerate 30 \
            -draw_mouse 0 \
            -i :99.0 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -b:v 2500k \
            -minrate 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmps://a.rtmps.youtube.com/live2/${STREAM_KEY}"

      - name: Debug Logs
        if: always()

        run: |

          echo "========== SERVER =========="
          tail -100 /tmp/server.log || true

          echo "========== CHROMIUM =========="
          tail -100 /tmp/chromium.log || true

          echo "========== XVFB =========="
          tail -100 /tmp/xvfb.log || true
