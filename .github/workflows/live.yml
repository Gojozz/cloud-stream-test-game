name: YouTube Shorts Live Stream

on:
  workflow_dispatch:
  schedule:
    # Jadwal otomatis jam 19.00 WIB
    - cron: '0 12 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser pulseaudio

      - name: Start Express & Socket.io Server
        run: |
          node server.js &
          sleep 5

      - name: Start Headless Browser & Stream to YouTube Shorts
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Start PulseAudio untuk Audio
          pulseaudio --start
          sleep 2

          # 2. Setup Layar Vertikal
          Xvfb :99 -screen 0 720x1280x24 &
          export DISPLAY=:99
          sleep 2

          # 3. Jalankan Browser (Tanpa Translate & Tanpa Popup)
          chromium-browser --no-sandbox --disable-setuid-sandbox \
            --window-size=720,1280 \
            --window-position=0,0 \
            --kiosk \
            --disable-translate \
            --disable-features=Translate \
            --autoplay-policy=no-user-gesture-required \
            http://localhost:3000 &
          sleep 5

          # 4. Stream ke YouTube
          ffmpeg -f x11grab -video_size 720x1280 -framerate 30 -i :99.0 \
            -f pulse -ac 2 -i default \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -g 60 -keyint_min 30 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
