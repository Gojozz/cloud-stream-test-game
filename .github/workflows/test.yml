name: Test Game Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg

      - name: Start local web server
        run: |
          python3 -m http.server 8080 &
          sleep 3

      - name: Test game
        run: |
          chromium-browser \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=10000 \
            --screenshot=game-test.png \
            http://127.0.0.1:8080

      - name: Check result
        run: |
          ls -lh game-test.png
          file game-test.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: game-test-screenshot
          path: game-test.png
