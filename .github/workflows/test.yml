name: YouTube Live RTMPS Test

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium ffmpeg xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 3

      - name: Start game server
        run: |
          python3 -m http.server 8080 > server.log 2>&1 &
          sleep 3

      - name: Start Chromium
        env:
          DISPLAY: :99
        run: |
          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --window-size=1280,720 \
            --start-maximized \
            --no-first-run \
            --no-default-browser-check \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            http://127.0.0.1:8080 \
            > chromium.log 2>&1 &

          sleep 5

      - name: Stream to YouTube RTMPS
        env:
          DISPLAY: :99
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          timeout 150 ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 30 \
            -i :99.0 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -t 120 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 4000k \
            -minrate 4000k \
            -maxrate 4000k \
            -bufsize 8000k \
            -pix_fmt yuv420p \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmps://a.rtmps.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            2>&1 | tee youtube.log

      - name: Show diagnostic log
        if: always()
        run: |
          echo "===== LAST YOUTUBE LOG ====="
          tail -100 youtube.log || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-rtmps-test-logs
          path: |
            youtube.log
            chromium.log
            server.log
