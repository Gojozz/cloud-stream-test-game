name: YouTube Live Test - Lightweight

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium ffmpeg xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 3

      - name: Start game server
        run: |
          python3 -m http.server 8080 > server.log 2>&1 &
          sleep 3

      - name: Start Chromium
        env:
          DISPLAY: :99
        run: |
          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --window-size=1280,720 \
            --start-maximized \
            --no-first-run \
            --no-default-browser-check \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            http://127.0.0.1:8080 \
            > chromium.log 2>&1 &

          sleep 5

      - name: Test YouTube connection
        env:
          DISPLAY: :99
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          echo "Starting YouTube stream..."
          echo "Resolution: 1280x720"
          echo "FPS: 30"
          echo "Bitrate: 1500 kbps"
          echo "Duration: 120 seconds"

          timeout 150 ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 30 \
            -i :99.0 \
            -t 120 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -b:v 1500k \
            -maxrate 1500k \
            -bufsize 3000k \
            -pix_fmt yuv420p \
            -g 60 \
            -keyint_min 60 \
            -f flv \
            "rtmps://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
            2>&1 | tee youtube.log

      - name: Show stream log
        if: always()
        run: |
          echo "===== YOUTUBE LOG ====="
          tail -100 youtube.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-test-logs
          path: |
            youtube.log
            chromium.log
            server.log
