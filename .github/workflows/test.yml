name: Test Real-Time Game Capture

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            ffmpeg \
            xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          echo $! > xvfb.pid
          sleep 3

      - name: Start game server
        run: |
          python3 -m http.server 8080 > server.log 2>&1 &
          echo $! > server.pid
          sleep 3

      - name: Start Chromium
        env:
          DISPLAY: :99
        run: |
          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            --window-size=1280,720 \
            --start-maximized \
            --no-first-run \
            --no-default-browser-check \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            http://127.0.0.1:8080 \
            > chromium.log 2>&1 &

          echo $! > chromium.pid
          sleep 5

      - name: Record real-time game
        env:
          DISPLAY: :99
        run: |
          ffmpeg \
            -y \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 30 \
            -i :99.0 \
            -t 30 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            game-realtime.mp4

      - name: Check video
        run: |
          echo "===== VIDEO ====="
          ls -lh game-realtime.mp4

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            game-realtime.mp4

      - name: Upload real-time video
        uses: actions/upload-artifact@v4
        with:
          name: game-realtime-video
          path: game-realtime.mp4

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-logs
          path: |
            chromium.log
            server.log
