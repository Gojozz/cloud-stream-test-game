name: Test Game FFmpeg

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium ffmpeg

      - name: Start game server
        run: |
          python3 -m http.server 8080 &
          sleep 3

      - name: Render game
        run: |
          chromium \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=1280,720 \
            --screenshot=frame.png \
            --virtual-time-budget=30000 \
            http://127.0.0.1:8080

          echo "Checking screenshot..."
          ls -lh frame.png
          file frame.png

      - name: Create 30 second video
        run: |
          ffmpeg \
            -y \
            -loop 1 \
            -i frame.png \
            -t 30 \
            -r 30 \
            -vf "scale=1280:720,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            game-test.mp4

      - name: Check video
        run: |
          echo "Video information:"
          ls -lh game-test.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            game-test.mp4

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: game-test-screenshot
          path: frame.png

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: game-test-video
          path: game-test.mp4
