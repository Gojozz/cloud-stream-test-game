<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Spin Live V2</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#030711;color:#fff}
body{background:radial-gradient(circle at 50% 45%,#173d67 0,transparent 38%),radial-gradient(circle at 20% 20%,#006aa522,transparent 25%),#030711}.app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative}.app:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:70px 70px;opacity:.12}
header{height:12%;display:flex;align-items:center;justify-content:space-between;padding:8px 2.5%;background:#030914dd;border-bottom:1px solid #31577f;position:relative;z-index:2}.logo{font-size:clamp(22px,3.2vw,40px);font-weight:1000;letter-spacing:3px;text-shadow:0 0 18px #18bfff}.logo span{color:#ffd33d}.sub{font-size:10px;letter-spacing:2px;color:#8ca9c7}.timer{padding:8px 18px;border:1px solid #426789;border-radius:30px;background:#071527;font-size:clamp(15px,2vw,25px);font-weight:900}.timer span{color:#ffd33d}

@media(max-width:800px){.main{grid-template-columns:31% 38% 31%;padding:3px}.card{padding:6px;border-radius:13px}.playerTop{gap:5px}.avatar{width:34px;height:34px;font-size:19px}.numbers{gap:3px}.num,.bet{padding:5px 0}.wheelWrap{width:35vw;height:35vw}}
</style></head><body><div class="app"><header><div><div class="logo">SUPER <span>SPIN</span></div><div class="sub">LIVE VIRTUAL BATTLE • JACKPOT 13</div></div><div class="timer">NEXT SPIN <span id="timer">60</span>s</div></header>
<main class="main"><section class="side"><div class="card"><div class="playerTop"><div class="avatar">🦊</div><div class="info"><div class="pname">Raka</div><div class="money" id="c1">$10,000</div></div></div><div class="status" id="s1"></div><div class="label">PILIH ANGKA</div><div class="numbers" id="n1"></div><div class="label">BET</div><div class="bets" id="b1"></div></div></section>
<section class="center"><div class="wheelWrap"><div class="badge">⚡ SUPER SPIN LIVE ⚡</div><div class="pointer"></div><canvas id="wheel" width="800" height="800"></canvas><div class="centerText">SPIN<small>15 NUMBERS</small></div></div></section>
<section class="side"><div class="card"><div class="playerTop"><div class="avatar">🐰</div><div class="info"><div class="pname">Bimo</div><div class="money" id="c2">$10,000</div></div></div><div class="status" id="s2"></div><div class="label">PILIH ANGKA</div><div class="numbers" id="n2"></div><div class="label">BET</div><div class="bets" id="b2"></div></div></section></main>
<footer class="bottom"><div class="log" id="log">🎯 Raka dan Bimo sedang memilih angka...</div></footer></div>
<script>
const BETS=[100,500,1000,5000],N=15,ARC=Math.PI*2/N,P=[{money:10000,num:0,bet:100,style:1},{money:10000,num:0,bet:100,style:0}],COLORS=['#17395c','#24547d','#17395c','#24547d','#17395c','#24547d','#17395c','#24547d','#17395c','#24547d','#17395c','#24547d','#b32132','#24547d','#17395c'];let rot=0,timer=60,spinning=false,history=[],audioCtx=null;
const $=x=>document.getElementById(x),fmt=n=>'$'+n.toLocaleString('en-US');
function sound(type){try{audioCtx||=(new(window.AudioContext||window.webkitAudioContext)());let o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);if(type==='tick'){o.frequency.value=900;g.gain.setValueAtTime(.025,now);g.gain.exponentialRampToValueAtTime(.001,now+.06);o.start(now);o.stop(now+.07)}else if(type==='coin'){o.frequency.value=900;o.frequency.exponentialRampToValueAtTime(1500,now+.12);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.14);o.start(now);o.stop(now+.15)}else if(type==='spin'){o.type='sawtooth';o.frequency.value=180;g.gain.setValueAtTime(.025,now);g.gain.exponentialRampToValueAtTime(.001,now+.8);o.start(now);o.stop(now+.8)}else{o.frequency.value=500;o.frequency.exponentialRampToValueAtTime(1200,now+.5);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.7);o.start(now);o.stop(now+.7)}}catch(e){}}
function setup(i){for(let x=1;x<=15;x++){let b=document.createElement('button');b.className='num'+(x===13?' jack':'');b.textContent=x;b.onclick=()=>{if(!spinning){P[i].num=x;sound('tick');render()}};$('n'+(i+1)).appendChild(b)}BETS.forEach(v=>{let b=document.createElement('button');b.className='bet';b.textContent='$'+v.toLocaleString();b.onclick=()=>{if(!spinning&&v<=P[i].money){P[i].bet=v;sound('tick');render()}};$('b'+(i+1)).appendChild(b)})}setup(0);setup(1);
function choose(p){let w=Array(16).fill(1);history.slice(-8).forEach(n=>w[n]*=.65);w[13]*=p.style?3.2:1.35;let sum=w.slice(1).reduce((a,b)=>a+b,0),r=Math.random()*sum,n=1;for(let x=1;x<=15;x++){r-=w[x];if(r<=0){n=x;break}}p.num=n;p.bet=p.money<5000?[100,500,1000][Math.floor(Math.random()*3)]:(p.style&&Math.random()<.35?5000:[100,500,1000][Math.floor(Math.random()*3)]);if(p.bet>p.money)p.bet=100}
function render(){P.forEach((p,i)=>{$('c'+(i+1)).textContent=fmt(p.money);$('s'+(i+1)).textContent='Pilihan: '+p.num+' • '+fmt(p.bet);[...$('n'+(i+1)).children].forEach((b,x)=>b.classList.toggle('selected',x+1===p.num));[...$('b'+(i+1)).children].forEach((b,x)=>b.classList.toggle('selected',BETS[x]===p.bet))});draw()}
function draw(){let c=$('wheel'),x=c.getContext('2d'),cx=400,cy=400,r=340;x.clearRect(0,0,800,800);x.save();x.translate(cx,cy);x.rotate(rot);x.beginPath();x.arc(0,0,r+22,0,Math.PI*2);x.strokeStyle='#38cfff';x.lineWidth=14;x.shadowBlur=25;x.shadowColor='#00bfff';x.stroke();x.shadowBlur=0;for(let i=0;i<N;i++){let a=i*ARC-Math.PI/2;x.beginPath();x.moveTo(0,0);x.arc(0,0,r,a,a+ARC);x.closePath();x.fillStyle=COLORS[i];x.fill();x.strokeStyle='#071323';x.lineWidth=5;x.stroke();x.save();x.rotate(a+ARC/2);x.translate(r*.73,0);x.rotate(Math.PI/2);x.fillStyle='#fff';x.font='bold 31px Arial';x.textAlign='center';x.fillText(i+1,0,0);x.restore()}x.beginPath();x.arc(0,0,67,0,Math.PI*2);x.fillStyle='#050d19';x.fill();x.strokeStyle='#ffd33d';x.lineWidth=6;x.stroke();x.restore()}
function spin(){if(spinning)return;spinning=true;sound('spin');P.forEach(p=>{if(p.money<=0)p.money=10000;choose(p);p.money-=p.bet});render();$('log').textContent='🔒 TARUHAN TERKUNCI • RODA BERPUTAR...';let result=Math.floor(Math.random()*15)+1;history.push(result);let target=-(result-.5)*ARC,start=rot,delta=((target-start)%(Math.PI*2)+Math.PI*2)%(Math.PI*2),end=start+Math.PI*2*7+delta,t0=performance.now(),dur=6500;function anim(t){let q=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-q,4);rot=start+(end-start)*e;draw();q<1?requestAnimationFrame(anim):finish(result)}requestAnimationFrame(anim)}
function finish(r){spinning=false;P.forEach(p=>{if(p.num===r){p.money+=p.bet*(r===13?10:2);sound(r===13?'jack':'coin')}if(p.money<=0)p.money=10000});$('log').innerHTML=r===13?'<span class="jackpot">🔥 JACKPOT! ANGKA 13! x10 🔥</span>':'🎯 HASIL RODA: <span class="gold">'+r+'</span>';render();timer=60}
function tick(){timer--;if(timer<=5)sound('tick');$('timer').textContent=timer;if(timer<=0){timer=60;spin()}}P.forEach(choose);render();setInterval(tick,1000);document.addEventListener('click',()=>{try{audioCtx?.resume()}catch(e){}},{once:true});
</script></body></html>
