<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marble Race Live Shorts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #0a0c14; 
            color: #fff; 
            width: 720px; 
            height: 1280px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            padding: 30px 20px; 
            overflow: hidden; 
        }

        /* HEADER */
        .header { text-align: center; margin-top: 10px; }
        .title { 
            font-size: 3.5rem; 
            font-weight: 900; 
            letter-spacing: 2px; 
            color: #ffb703;
            text-shadow: 0 0 20px rgba(255, 183, 3, 0.6); 
        }
        .subtitle { 
            color: #00f0ff; 
            font-weight: 700; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
        }

        /* TRACK BALAPAN */
        .track-container {
            width: 100%;
            height: 800px;
            background: rgba(255, 255, 255, 0.04);
            border: 4px solid #ffb703;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        /* FINISH LINE */
        .finish-line {
            position: absolute;
            bottom: 30px;
            width: 100%;
            height: 25px;
            background: repeating-linear-gradient(45deg, #fff, #fff 15px, #000 15px, #000 30px);
            border-top: 3px solid #ff0055;
            border-bottom: 3px solid #ff0055;
        }

        /* MARBLE */
        .marble {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            color: #000;
            transition: top 1s ease-in-out;
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            border: 3px solid #fff;
        }

        /* AI HOST BANNER */
        .ai-banner {
            width: 100%;
            background: #8a2be2;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        .ai-badge { 
            background: #fff; 
            color: #8a2be2; 
            font-weight: 900; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            width: fit-content;
        }

        .ai-speech { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #fff; 
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">MARBLE RACE</div>
        <div class="subtitle">Ketik Namamu Di Chat!</div>
    </div>

    <div class="track-container">
        <div class="finish-line"></div>
        <div class="marble" id="m1" style="background:#ff0055; top:40px; left:60px;">Rizal</div>
        <div class="marble" id="m2" style="background:#00f0ff; top:40px; left:200px;">Budi</div>
        <div class="marble" id="m3" style="background:#ffb703; top:40px; left:340px;">Siti</div>
        <div class="marble" id="m4" style="background:#2ecc71; top:40px; left:480px;">Agus</div>
    </div>

    <div class="ai-banner">
        <div class="ai-badge">🤖 LUNA AI HOST</div>
        <div class="ai-speech" id="aiSpeech">Balapan kelereng segera dimulai! Siapa yang bakal meluncur paling kencang?</div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const aiSpeech = document.getElementById('aiSpeech');
        const m1 = document.getElementById('m1');
        const m2 = document.getElementById('m2');
        const m3 = document.getElementById('m3');
        const m4 = document.getElementById('m4');

        // Safe Web Audio API
        let audioCtx;
        function playTone(freq, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Connect Socket
        try {
            const socket = io('http://127.0.0.1:3000');

            socket.on('aiResponse', (data) => {
                if (data.speechText) aiSpeech.innerText = data.speechText;
                
                // Animasi Pergerakan Kelereng
                m1.style.top = (Math.random() * 620 + 50) + "px";
                m2.style.top = (Math.random() * 620 + 50) + "px";
                m3.style.top = (Math.random() * 620 + 50) + "px";
                m4.style.top = (Math.random() * 620 + 50) + "px";

                playTone(440, 0.2);
            });
        } catch(e) {}
    </script>
</body>
</html>
