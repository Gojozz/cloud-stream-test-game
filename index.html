<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Spin Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0c10; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; overflow: hidden; padding: 20px; }
        
        /* Header Title */
        .header { text-align: center; margin-top: 10px; }
        .title { font-size: 3rem; font-weight: 900; letter-spacing: 2px; color: #f39c12; text-shadow: 0 0 20px rgba(243, 156, 18, 0.6); }
        .subtitle { color: #8e44ad; font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; }

        /* Main Game Layout */
        .main-container { display: flex; width: 100%; max-width: 1200px; justify-content: space-between; align-items: center; flex: 1; }
        
        /* Player Panels */
        .player-card { background: rgba(22, 27, 34, 0.8); border: 2px solid #1f2937; border-radius: 16px; padding: 20px; width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .player-card.active { border-color: #f39c12; box-shadow: 0 0 15px rgba(243, 156, 18, 0.3); }
        .avatar { font-size: 3rem; margin-bottom: 5px; }
        .player-name { font-size: 1.5rem; font-weight: bold; }
        .balance { color: #2ecc71; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }

        /* Wheel Section */
        .wheel-container { position: relative; width: 380px; height: 380px; display: flex; justify-content: center; align-items: center; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #f39c12; position: relative; transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1); box-shadow: 0 0 30px rgba(243, 156, 18, 0.4); background: conic-gradient(#1f242d 0deg 24deg, #2c3e50 24deg 48deg, #1f242d 48deg 72deg, #2c3e50 72deg 96deg, #1f242d 96deg 120deg, #2c3e50 120deg 144deg, #1f242d 144deg 168deg, #2c3e50 168deg 192deg, #1f242d 192deg 216deg, #2c3e50 216deg 240deg, #1f242d 240deg 264deg, #2c3e50 264deg 288deg, #1f242d 288deg 312deg, #2c3e50 312deg 336deg, #1f242d 336deg 360deg); }
        .pointer { position: absolute; top: -15px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #e74c3c; z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }

        /* AI Host Banner (Respon Chat Live) */
        .ai-host-banner { width: 100%; max-width: 1000px; background: linear-gradient(90deg, #8e44ad, #3498db); border-radius: 12px; padding: 15px 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); margin-bottom: 10px; }
        .ai-badge { background: #fff; color: #8e44ad; font-weight: 900; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; text-transform: uppercase; }
        .ai-speech { font-size: 1.2rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">SUPER SPIN</div>
        <div class="subtitle">Live Virtual Battle</div>
    </div>

    <div class="main-container">
        <!-- Player 1 -->
        <div class="player-card active">
            <div class="avatar">🦊</div>
            <div class="player-name">MAX</div>
            <div class="balance">$10,000</div>
        </div>

        <!-- Roda Spin -->
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <!-- Player 2 -->
        <div class="player-card">
            <div class="avatar">🐰</div>
            <div class="player-name">LEO</div>
            <div class="balance">$10,000</div>
        </div>
    </div>

    <!-- Banner Respons AI Host LUNA -->
    <div class="ai-host-banner">
        <div class="ai-badge">LUNA AI HOST</div>
        <div class="ai-speech" id="aiSpeech">Selamat datang penonton! Tulis angka pilihanmu di Live Chat!</div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // Hubungkan ke Node server AI di port 3000
        const socket = io('http://127.0.0.1:3000');
        const wheel = document.getElementById('wheel');
        const aiSpeech = document.getElementById('aiSpeech');

        // Terima perintah putar roda & ucapan dari AI Host
        socket.on('aiResponse', (data) => {
            if (data.speechText) {
                aiSpeech.innerText = data.speechText;
            }
            if (data.targetNumber) {
                const degreesPerNumber = 360 / 15;
                const rotation = 3600 + ((data.targetNumber - 1) * degreesPerNumber);
                wheel.style.transform = `rotate(${rotation}deg)`;
            }
        });
    </script>
</body>
</html>
