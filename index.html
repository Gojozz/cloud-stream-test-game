<!doctype html>
<html><head><meta charset="utf-8"><title>Cloud Arcade Live</title>
<style>html,body{margin:0;overflow:hidden;background:#101522}canvas{display:block;width:1280px;height:720px}</style>
</head><body><canvas id="g" width="1280" height="720"></canvas>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');let t=0;
const b=[...Array(18)].map((_,i)=>({a:i*Math.PI*2/18,r:190+(i%4)*28,s:.5+i%5*.12}));
function f(){t+=1/60;x.fillStyle='#101522';x.fillRect(0,0,1280,720);
b.forEach((q,i)=>{let a=q.a+t*q.s,px=640+Math.cos(a)*q.r,py=360+Math.sin(a)*q.r;
x.beginPath();x.arc(px,py,10+(i%3)*3,0,7);x.fillStyle=i%2?'#55d6ff':'#ffd447';x.fill()});
x.beginPath();x.arc(640,360,210,0,7);x.strokeStyle='#fff';x.lineWidth=5;x.stroke();
let a=t,px=640+Math.cos(a)*105,py=360+Math.sin(a)*105;
x.beginPath();x.arc(px,py,34,0,7);x.fillStyle='#ff5b6e';x.fill();
x.fillStyle='#fff';x.font='bold 42px Arial';x.textAlign='center';x.fillText('CLOUD ARCADE LIVE',640,72);
x.font='bold 28px Arial';x.fillText('Score: '+Math.floor(t*10),640,665);
x.font='20px Arial';x.fillStyle='#aebbd0';x.fillText('GitHub Actions • FFmpeg • YouTube',640,700);
requestAnimationFrame(f)}f();
</script></body></html>
