<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Spin Live Shorts</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: rgba(22, 27, 38, 0.95);
            --accent-gold: #ffb703;
            --accent-purple: #8a2be2;
            --accent-cyan: #00f0ff;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: radial-gradient(circle at center, #1b1e2e 0%, #090a0f 100%); 
            color: var(--text-color); 
            width: 720px;
            height: 1280px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            overflow: hidden; 
            padding: 30px 20px; 
        }

        /* HEADER */
        .header { text-align: center; }
        .title { 
            font-size: 3.8rem; 
            font-weight: 900; 
            letter-spacing: 2px; 
            background: linear-gradient(180deg, #fff 20%, var(--accent-gold) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 30px rgba(255, 183, 3, 0.5); 
        }
        .subtitle { 
            color: var(--accent-cyan); 
            font-weight: 700; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 6px; 
        }

        /* WHEEL SECTION */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .jackpot-banner {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            text-transform: uppercase;
        }

        .wheel-container { 
            position: relative; 
            width: 460px; 
            height: 460px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .wheel-outer-ring {
            position: absolute;
            width: 485px;
            height: 485px;
            border-radius: 50%;
            border: 6px dashed var(--accent-gold);
            animation: rotateRing 40s linear infinite;
            opacity: 0.7;
        }

        @keyframes rotateRing { 100% { transform: rotate(360deg); } }

        .wheel { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 10px solid var(--accent-gold); 
            position: relative; 
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1); 
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8); 
            background: conic-gradient(
                #e74c3c 0deg 24deg, #3498db 24deg 48deg, #2ecc71 48deg 72deg, #f1c40f 72deg 96deg,
                #9b59b6 96deg 120deg, #1abc9c 120deg 144deg, #e67e22 144deg 168deg, #34495e 168deg 192deg,
                #e74c3c 192deg 216deg, #3498db 216deg 240deg, #2ecc71 240deg 264deg, #f1c40f 264deg 288deg,
                #9b59b6 288deg 312deg, #1abc9c 288deg 336deg, #e67e22 336deg 360deg
            ); 
        }

        .wheel-center {
            position: absolute;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #fff, #888);
            border-radius: 50%;
            border: 5px solid var(--accent-gold);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: #000;
        }

        .pointer { 
            position: absolute; 
            top: -22px; 
            width: 0; 
            height: 0; 
            border-left: 22px solid transparent; 
            border-right: 22px solid transparent; 
            border-top: 42px solid #ff0055; 
            z-index: 10; 
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.7)); 
        }

        /* PLAYERS & CHAT HUD */
        .players-container {
            display: flex;
            width: 100%;
            gap: 15px;
        }

        .player-card { 
            background: var(--card-bg); 
            border: 2px solid rgba(255, 255, 255, 0.15); 
            border-radius: 20px; 
            padding: 15px; 
            flex: 1; 
            text-align: center; 
        }
        .player-card.active { border-color: var(--accent-gold); }
        .avatar { font-size: 2.5rem; }
        .player-name { font-size: 1.2rem; font-weight: 800; }
        .bet-box { background: rgba(0,0,0,0.5); border-radius: 10px; padding: 6px; margin-top: 5px; }
        .bet-number { color: var(--accent-cyan); font-weight: 800; font-size: 1.1rem; }

        /* AI HOST BANNER */
        .ai-host-banner { 
            width: 100%; 
            background: linear-gradient(90deg, rgba(138,43,226,0.95), rgba(0,240,255,0.95)); 
            border-radius: 18px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            gap: 8px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.6); 
        }
        
        .ai-badge { 
            background: #fff; 
            color: var(--accent-purple); 
            font-weight: 900; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            letter-spacing: 1.5px;
            width: fit-content;
        }

        .ai-speech { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #fff; 
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <!-- AUDIO FILES -->
    <audio id="audioBgm" src="assets/bgm.mp3" loop autoplay volume="0.3"></audio>
    <audio id="audioSpin" src="assets/spin.wav"></audio>
    <audio id="audioWin" src="assets/win.mp3"></audio>

    <div class="header">
        <div class="title">SUPER SPIN</div>
        <div class="subtitle">Live Shorts AI Battle</div>
    </div>

    <div class="wheel-section">
        <div class="jackpot-banner" id="timerStatus">NEXT SPIN IN: 20S</div>
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel-outer-ring"></div>
            <div class="wheel" id="wheel"></div>
            <div class="wheel-center">SPIN</div>
        </div>
    </div>

    <div class="players-container">
        <div class="player-card active">
            <div class="avatar">🦊</div>
            <div class="player-name" id="p1Name">MAX</div>
            <div class="bet-box">TEBAKAN: <span class="bet-number" id="p1Bet">ANGKA 7</span></div>
        </div>
        <div class="player-card">
            <div class="avatar">🐰</div>
            <div class="player-name" id="p2Name">LIVE CHAT</div>
            <div class="bet-box">TEBAKAN: <span class="bet-number" id="p2Bet">ANGKA 12</span></div>
        </div>
    </div>

    <div class="ai-host-banner">
        <div class="ai-badge">🤖 LUNA AI HOST</div>
        <div class="ai-speech" id="aiSpeech">Selamat datang di Live Shorts Super Spin! Ketik angka (1-15) di chat untuk tebak!</div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const wheel = document.getElementById('wheel');
        const aiSpeech = document.getElementById('aiSpeech');
        const timerStatus = document.getElementById('timerStatus');
        const p1Name = document.getElementById('p1Name');
        const p1Bet = document.getElementById('p1Bet');
        const p2Name = document.getElementById('p2Name');
        const p2Bet = document.getElementById('p2Bet');

        const audioBgm = document.getElementById('audioBgm');
        const audioSpin = document.getElementById('audioSpin');
        const audioWin = document.getElementById('audioWin');

        // WEB AUDIO SYNTHESIZER (Penyelamat jika file .mp3 / .wav tidak ada)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, duration, type='sine') {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playSpinAudio() {
            audioSpin.currentTime = 0;
            audioSpin.play().catch(() => {
                // Fallback synth sound jika file audio tidak ada
                for(let i=0; i<8; i++) {
                    setTimeout(() => playTone(300 + (i*50), 0.1, 'square'), i * 150);
                }
            });
        }

        function playWinAudio() {
            audioWin.currentTime = 0;
            audioWin.play().catch(() => {
                // Fallback synth win sound
                playTone(523.25, 0.2, 'triangle'); // C5
                setTimeout(() => playTone(659.25, 0.2, 'triangle'), 150); // E5
                setTimeout(() => playTone(783.99, 0.4, 'triangle'), 300); // G5
            });
        }

        // Auto unlock Audio Context
        document.addEventListener('click', () => { audioCtx.resume(); audioBgm.play().catch(()=>{}); }, { once: true });

        let currentRotation = 0;

        function spinWheelTo(number) {
            playSpinAudio();

            const degreesPerSegment = 360 / 15;
            const targetDegree = (number - 1) * degreesPerSegment;
            currentRotation += 1800 + (360 - (currentRotation % 360)) + targetDegree;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            timerStatus.innerText = `MEMUTAR KE ANGKA ${number}...`;

            setTimeout(() => {
                timerStatus.innerText = `ANGKA MENANG: ${number}!`;
                playWinAudio();
            }, 4000);
        }

        // Socket.io Listener ke Server AI
        let socket;
        try {
            socket = io('http://127.0.0.1:3000');

            socket.on('aiResponse', (data) => {
                if (data.speechText) aiSpeech.innerText = data.speechText;
                if (data.playerName) p2Name.innerText = data.playerName;
                if (data.guessNumber) p2Bet.innerText = "ANGKA " + data.guessNumber;
                if (data.targetNumber) spinWheelTo(data.targetNumber);
            });
        } catch(e) {
            console.log("Offline mode");
        }
    </script>
</body>
</html>
