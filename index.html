<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Live</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="header">
    <div class="live">● LIVE</div>
    <div class="title">RACING LIVE</div>
    <div class="round">ROUND <b id="round">1</b></div>
</header>

<main class="main">

    <!-- RANKING -->
    <section class="panel ranking">
        <div class="panel-title">RANKING</div>
        <div class="player" id="p1">
            <span class="dot red"></span>
            <span class="player-name">Rizal</span>
        </div>
        <div class="player" id="p2">
            <span class="dot cyan"></span>
            <span class="player-name">Budi</span>
        </div>
        <div class="player" id="p3">
            <span class="dot yellow"></span>
            <span class="player-name">Siti</span>
        </div>
        <div class="player" id="p4">
            <span class="dot green"></span>
            <span class="player-name">Agus</span>
        </div>
        <div class="player" id="p5">
            <span class="dot purple"></span>
            <span class="player-name">Dewi</span>
        </div>
    </section>

    <!-- TRACK -->
    <section class="track" id="track">
        <div class="countdown">
            <span id="countdownText"></span>
        </div>

        <div class="car" id="m1"><span class="car-name">Alex</span></div>
        <div class="car" id="m2"><span class="car-name">Liam</span></div>
        <div class="car" id="m3"><span class="car-name">Emma</span></div>
        <div class="car" id="m4"><span class="car-name">Noah</span></div>
        <div class="car" id="m5"><span class="car-name">Mia</span></div>

        <div class="winner" id="winner">
            <div class="winner-small">🏆 WINNER</div>
            <div class="winner-name" id="winnerName">---</div>
        </div>
    </section>

    <!-- NEXT RACERS -->
    <section class="panel joiners">
        <div class="panel-title" id="nextRacersTitle">NEXT RACERS</div>
        <div class="joiners-list" id="joinersList">
            Waiting for racers...
        </div>
    </section>

</main>

<section class="ai">
    <div class="ai-left">
        <div class="ai-avatar">🤖</div>
        <div>
            <div class="ai-name">LUNA AI HOST</div>
            <div class="ai-status">LIVE COMMENTARY</div>
        </div>
    </div>
    <div class="speech" id="aiSpeech">
        Welcome to Racing Live! Type JOIN in chat to race!
    </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>

</body>
</html>
